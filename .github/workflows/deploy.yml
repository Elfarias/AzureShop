name: AzureShop DevSecOps Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Requerido para autenticação OIDC (Passwordless)
  contents: read    # Requerido para leitura do código-fonte
  security-events: write # Permite publicar relatórios na aba Security do GitHub

env:
  RESOURCE_GROUP: "rg-imersao-arquitetoazure"
  AKS_CLUSTER: "aks-imersao-elfarias"
  ACR_NAME: "acrimersaoelfarias"
  ACR_REGISTRY: "acrimersaoelfarias.azurecr.io"
  IMAGE_NAME: "azure-shop"
  K8S_NAMESPACE: "azure-shop"
  K8S_DEPLOYMENT: "azure-shop"

jobs:
  security-and-quality:
    name: 🛡️ Security & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Baixa o histórico completo para varredura de commits

      - name: 1. Secret Scanning (GitLeaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 2. Análise de Dependências (SCA) e Testes
        run: |
          npm ci
          npm test
          npm audit --audit-level=high

      - name: 3. IaC Security Scan (Checkov - Terraform)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: 'infra/'
          framework: 'terraform'
          soft_fail: true # Alertar vulnerabilidades sem bloquear imediatamente o pipeline

  build-scan-deploy:
    name: 🚀 Build, Container Scan & Deploy
    needs: security-and-quality # O deploy só inicia se a fase de segurança aprovar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login no Azure Container Registry (ACR)
        run: |
          az acr login --name ${{ env.ACR_NAME }}

      - name: Build da Imagem Docker Local
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}
          docker build -t ${FULL_IMAGE_NAME}:${IMAGE_TAG} -t ${FULL_IMAGE_NAME}:latest .

      - name: 4. Varredura de Imagem Container (Trivy Scan)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push da Imagem para o ACR
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}
          docker push ${FULL_IMAGE_NAME}:${IMAGE_TAG}
          docker push ${FULL_IMAGE_NAME}:latest

      - name: Conectar ao AKS
        run: |
          az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.AKS_CLUSTER }} --overwrite-existing

      - name: Rollout no AKS (Rolling Update)
        run: |
          IMAGE_TAG=${{ github.sha }}
          FULL_IMAGE_NAME=${{ env.ACR_REGISTRY }}/${{ env.IMAGE_NAME }}
          kubectl set image deployment/${{ env.K8S_DEPLOYMENT }} ${{ env.IMAGE_NAME }}=${FULL_IMAGE_NAME}:${IMAGE_TAG} -n ${{ env.K8S_NAMESPACE }}
          kubectl rollout status deployment/${{ env.K8S_DEPLOYMENT }} -n ${{ env.K8S_NAMESPACE }} --timeout=120s

      - name: Verificar Pods Ativos
        run: |
          kubectl get pods -n ${{ env.K8S_NAMESPACE }} -o wide
