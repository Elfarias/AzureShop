name: AzureShop CI/CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # Obrigatório para a autenticação OIDC (Passwordless)
  contents: read    # Permitir leitura do código do repositório

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Autenticar no Azure via OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Validar Conexão com o Azure
        run: |
          echo "Autenticado com sucesso no Azure sem utilizar senhas estáticas!"
          az group show --name rg-imersao-arquitetoazure --output table

      - name: Conectar ao AKS e Verificar Pods
        run: |
          az aks get-credentials --resource-group rg-imersao-arquitetoazure --name aks-imersao-elfarias --overwrite-existing
          kubectl get pods -n azure-shop
